name: CD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        name: Check out repository
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        name: Set up Node.js
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        name: Install dependencies

      - name: Lint and format
        run: |
          npm run format:check
          npm run lint

      - name: Test
        run: npm run test

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Rebuild dist/
        run: npm run build

      - name: Verify dist/ is clean
        run: |
          if ! git diff --quiet dist/; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result before tagging."
            git diff --stat dist/
            exit 1
          fi

      - name: Move major version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MAJOR_VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/v\([0-9]*\).*/v\1/')
          git tag -f "$MAJOR_VERSION" "${GITHUB_REF_NAME}"
          git push -f origin "$MAJOR_VERSION"
