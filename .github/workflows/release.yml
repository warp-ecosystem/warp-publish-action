name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint and format
        run: |
          npm run format:check
          npm run lint

      - name: Test
        run: npm run test

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Rebuild dist/
        run: npm run build

      - name: Commit rebuilt dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m "rebuild dist/ for ${GITHUB_REF_NAME}"
            git push
          fi

      - name: Move major version tag
        run: |
          MAJOR_VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/v\([0-9]*\).*/v\1/')
          git tag -f "$MAJOR_VERSION" "${GITHUB_REF_NAME}"
          git push -f origin "$MAJOR_VERSION"
